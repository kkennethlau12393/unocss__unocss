name: abloh seal fix probe
on:
  push:
    branches: [abloh-seal-fix-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: fix probe
        run: bash .abloh-seal-bisect/fix-probe.sh 2>&1 | tee "$RUNNER_TEMP/fix-probe-summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seal-fix-probe-unocss
          path: |
            ${{ runner.temp }}/fix-probe
            ${{ runner.temp }}/fix-probe-summary.txt
