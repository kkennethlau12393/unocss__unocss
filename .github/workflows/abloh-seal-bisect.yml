name: abloh seal ci probe
on:
  push:
    branches: [abloh-seal-ci-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
      - name: ci probe
        run: bash .abloh-seal-bisect/ci-probe.sh 2>&1 | tee "$RUNNER_TEMP/ci-probe-summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seal-ci-probe-unocss
          path: |
            ${{ runner.temp }}/ci-probe
            ${{ runner.temp }}/ci-probe-summary.txt
