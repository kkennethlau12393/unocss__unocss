name: abloh seal worktree probe
on:
  push:
    branches: [abloh-seal-worktree]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
      - name: worktree probe
        run: bash .abloh-seal-bisect/worktree-probe.sh 2>&1 | tee "$RUNNER_TEMP/worktree-probe-summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seal-worktree-probe-unocss
          path: |
            ${{ runner.temp }}/worktree-probe
            ${{ runner.temp }}/worktree-probe-summary.txt
