name: abloh seal worktree probe 2
on:
  push:
    branches: [abloh-seal-wt-probe2]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
      - name: worktree probe 2
        run: bash .abloh-seal-bisect/wt-probe2.sh 2>&1 | tee "$RUNNER_TEMP/wt-probe2-summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seal-wt-probe2-unocss
          path: |
            ${{ runner.temp }}/wt-probe2
            ${{ runner.temp }}/wt-probe2-summary.txt
